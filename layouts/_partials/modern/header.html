    <header class="site-header">
      <a class="site-name" href="{{ .Site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>{{ .Site.Home.Title }}</a>
      <nav aria-label="Main navigation">
        <ul class="navigation">
          {{ range .Site.Menus.main }}
          <li><a href="{{ .URL | relURL }}"{{ if eq $.RelPermalink (.URL | relURL) }} aria-current="page"{{ else if and (eq .Identifier "research") $.Params.research }} aria-current="true"{{ end }}>{{ .Name }}</a></li>
          {{ end }}
        </ul>
      </nav>
    </header>
